name: sync-upstream

on:
  schedule:
    - cron: "0 18 * * *" # 毎日 03:00 JST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 起動時の SHA ではなく最新の main。続けて起動しても push が衝突しない
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Sync and build
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          pstack-cc/auto-sync.sh
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || [ "$code" = 10 ] || [ "$code" = 20 ]
      # 止まったら Claude Code に build.py の RULES と overrides/ を直させる。build と validate が通れば push する
      # 認証は secrets の ANTHROPIC_API_KEY か CLAUDE_CODE_OAUTH_TOKEN (claude setup-token で作る) のどちらか
      - name: Auto-fix with Claude Code
        id: fix
        if: steps.sync.outputs.code == '20'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret. Skipping the auto-fix."
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          if pstack-cc/auto-fix.sh; then
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            { echo; cat auto-fix-log.md; } >> auto-sync-report.md
          fi
      - name: Upload the auto-fix log
        if: steps.sync.outputs.code == '20'
        uses: actions/upload-artifact@v4
        with:
          name: auto-fix-log
          path: |
            auto-sync-report.md
            auto-fix-log.md
          if-no-files-found: ignore
      - name: Push
        if: steps.sync.outputs.code == '0' || steps.fix.outputs.fixed == 'true'
        run: git push origin HEAD:main
      - name: Open an issue
        if: steps.sync.outputs.code == '20' && steps.fix.outputs.fixed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream sync needs a manual fix"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file auto-sync-report.md
          else
            gh issue create --title "$title" --body-file auto-sync-report.md
          fi
      # 取り込みを止めた日も run を失敗にする。成功のままだと、止まったことが Issue にしか残らない (2026-10-13 から気付かなかった)
      - name: Fail when the sync stopped
        if: steps.sync.outputs.code == '20' && steps.fix.outputs.fixed != 'true'
        run: |
          echo "::error::Upstream sync stopped and the auto-fix did not work. See the issue \"Upstream sync needs a manual fix\"."
          exit 1
